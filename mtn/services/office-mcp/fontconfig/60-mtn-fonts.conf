<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Documents name "MTN Brighter Sans"; preview rendering falls back to Arial metrics. -->
<fontconfig>
  <alias binding="same">
    <family>MTN Brighter Sans</family>
    <prefer>
      <family>Arial</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
</fontconfig>
