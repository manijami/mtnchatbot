# Local settings for the operator-downloaded official Splunk MCP Server 2.1.0.
# These keys are defined in that release's README/mcp.conf.spec.
[server]
timeout = 60.0
max_row_limit = 100
default_row_limit = 100
ssl_verify = /run/splunk-tls/ca.pem
mcp_token_max_lifetime_seconds = 2592000
mcp_token_default_lifetime_seconds = 2592000

[rate_limits]
window_size_minutes = 1
global = 12
# Per-tool keys use the installed tool ID, not the published MCP name.
splunk_mcp_app_builtin:run_query = 6
