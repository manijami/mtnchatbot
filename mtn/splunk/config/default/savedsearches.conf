# Replay alerts: scheduler firing time is NOW, evidence time is the seeded incident.
# No outbound notification actions. Historical fired-alert records are never fabricated.

[Phoenix demo - Payment 5xx spike]
search = index=phoenix_app action=demo_alert_evidence demo_alert="Payment 5xx spike" | stats count latest(_time) as evidence_time | where count>0
is_scheduled = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -7d
dispatch.latest_time = now
dispatch.max_time = 60
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.expires = 7d
alert.suppress = 1
alert.suppress.period = 24h
actions =

