# No inherited user/power/admin role: their capabilities and index grants are broader.
[role_mtn_ops_readonly]
search = enabled
mcp_tool_execute = enabled
# Splunk's [default] stanza grants these unless explicitly overridden for this role.
edit_own_objects = disabled
list_all_objects = disabled
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled
queuedSearchQuota = 1
srchIndexesAllowed = phoenix_app;phoenix_net;phoenix_auth
srchIndexesDefault = phoenix_app;phoenix_net;phoenix_auth
srchTimeWin = 604800
srchTimeEarliest = 604800
srchMaxTime = 60s
srchJobsQuota = 2
cumulativeSrchJobsQuota = 2
srchDiskQuota = 100
# Zero is NOT used as a denial quota; no rtsearch capability is granted.
