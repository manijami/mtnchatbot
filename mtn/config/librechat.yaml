# MTN Employee AI — LibreChat config (tracked source of truth).
# Mounted into the api container at /app/librechat.yaml by docker-compose.override.yml.
# No secrets here: keys are referenced as ${ENV_VAR} and live in .env.
#
# Phase 1 (branding) uses PLACEHOLDERS, marked "PLACEHOLDER" below. Swap them for
# MTN-approved values when brand/legal deliver them; no code change is needed.
version: 1.3.18

cache: true

interface:
  # PLACEHOLDER copy — confirm wording with MTN internal comms.
  customWelcome: 'Welcome to MTN Employee AI, {{user.name}}. How can I help today?'

  # PLACEHOLDER URLs (example.com is reserved for documentation). Replace with MTN policy pages.
  privacyPolicy:
    externalUrl: 'https://example.com/mtn-employee-ai/privacy-placeholder'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://example.com/mtn-employee-ai/terms-placeholder'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'MTN Employee AI — Acceptable Use (PLACEHOLDER)'
    modalContent: |
      **PLACEHOLDER — not MTN-approved text.** Final terms will come from MTN Legal.

      - This assistant is for MTN employees and approved contractors only.
      - Do not enter customer personal data, credentials, or confidential information
        unless the connected model provider is approved by MTN for that data class.
      - AI output can be wrong. Check facts before relying on or sharing them.
      - Usage may be logged for security, audit, and service improvement.

  # MTN placeholder theme. Palette: MTN yellow #FFCB05 + black (public brand colours;
  # exact values to be confirmed by MTN brand). Partial token set: anything not named
  # here keeps the LibreChat default, so contrast-checked defaults still apply.
  # Light: black primary actions, yellow tints for selection. Dark: MTN yellow for links, focus,
  # primary (Save/Submit/Continue) buttons with a black label, and a yellow-tinted selected row.
  # The chat send button uses surface-inverted/text-inverted.
  # Contrast check: `node mtn/scripts/theme-contrast.js .` (table: docs/mtn/theme-contrast.md).
  theme:
    version: 1
    name: 'MTN (placeholder)'
    modes:
      light:
        colors:
          rgb-surface-submit: '0 0 0'
          rgb-surface-submit-hover: '51 51 51'
          rgb-button-primary: '0 0 0'
          rgb-button-primary-hover: '51 51 51'
          rgb-accent-primary: '0 0 0'
          rgb-accent-primary-hover: '51 51 51'
          rgb-border-field-focus: '0 0 0'
          rgb-surface-user-message: '255 243 196'
          rgb-surface-nav-selected: '255 227 128'
          rgb-surface-tab-selected: '255 227 128'
          rgb-avatar-fill: '255 203 5'
          rgb-avatar-text: '0 0 0'
        appearance:
          # MTN Brighter Sans is loaded by the branding image (mtn/branding/Dockerfile); Inter is the fallback.
          fontFamily: '"MTN Brighter Sans", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif'
      dark:
        colors:
          # Accents: MTN yellow replaces LibreChat green. Yellow fills carry a BLACK label
          # (text-on-status), so every other text-on-status fill moves to its bright end so
          # black text keeps AA (destructive, status-*-strong).
          rgb-accent-primary: '255 203 5'
          rgb-accent-primary-hover: '255 221 92'
          rgb-surface-submit: '255 203 5'
          rgb-surface-submit-hover: '255 221 92'
          rgb-text-on-status: '0 0 0'
          rgb-surface-destructive: '248 113 113'
          rgb-surface-destructive-hover: '252 165 165'
          rgb-status-error-strong: '248 113 113'
          rgb-status-success-strong: '52 211 153'
          rgb-status-warning-strong: '251 191 36'
          rgb-status-info-strong: '189 189 189'
          # Selected sidebar row / tab: yellow-tinted fill, >= 3:1 against the sidebar while
          # the row text (text-primary) keeps AA.
          # User message bubble: dark MTN-yellow tint (the light mode bubble is pale yellow).
          rgb-surface-user-message: '74 62 16'
          rgb-surface-nav-selected: '120 100 20'
          rgb-surface-tab-selected: '120 100 20'
          rgb-ring-primary: '255 203 5'
          rgb-focus-outline: '255 203 5'
          rgb-focus-control: '255 203 5'
          rgb-border-field-focus: '255 203 5'
          rgb-link: '255 203 5'
          rgb-link-hover: '255 221 92'
          rgb-link-prose: '255 203 5'
          rgb-avatar-fill: '255 203 5'
          rgb-avatar-text: '0 0 0'
        appearance:
          fontFamily: '"MTN Brighter Sans", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif'

  # MTN layout (top bar, MTN sidebar, Office cards): MTN fork flag, default false upstream.
  mtnLayout: true
  # No agents marketplace for now (MTN assistants are the model specs below).
  marketplace:
    use: false
  # Shared links off until MTN sets a sharing policy (decision 2026-11-08).
  sharedLinks:
    create: false
    share: false
    public: false

  # Upstream default interface settings (unchanged from Phase 0)
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  agents: true
  fileCitations: true

endpoints:
  custom:
    # DEV/TEST ONLY — Groq is not MTN-approved. Never send real MTN data here (see CLAUDE.md).
    - name: 'groq'
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1/'
      models:
        default:
          - 'openai/gpt-oss-120b'
          - 'openai/gpt-oss-20b'
        fetch: true
      titleConvo: true
      titleModel: 'openai/gpt-oss-20b'
      modelDisplayLabel: 'Groq'
    # DEV/TEST ONLY — NVIDIA-hosted API (build.nvidia.com) is not MTN-approved. Synthetic data only.
    # Nemotron returns its thinking in `reasoning_content`, which LibreChat shows in the
    # reasoning panel, never in the answer text.
    - name: 'nvidia'
      apiKey: '${NVIDIA_API_KEY}'
      baseURL: 'https://integrate.api.nvidia.com/v1'
      models:
        default:
          - 'nvidia/nemotron-3-ultra-550b-a55b'
        # meta/muse-glimmer-30b removed 2026-11-08: as accurate but 3-4x slower (CLAUDE.md log).
        fetch: false
      titleConvo: true
      titleEndpoint: 'groq'
      titleModel: 'openai/gpt-oss-20b'
      modelDisplayLabel: 'NVIDIA'
    # DEV/DEMO ONLY — MTN model router demo (mtn/deploy/compose.router.yml). Each turn is routed by
    # NVIDIA NeMo Switchyard across Groq gpt-oss-20b / gpt-oss-120b and NVIDIA Nemotron 3 Ultra via
    # router-lens (which adds the optional routing footer and the live feed). router-lens holds no
    # key; the value below only satisfies LibreChat's required field.
    - name: 'MTN Smart Router'
      apiKey: 'not-used-router-lens-holds-no-key'
      baseURL: 'http://router-lens:8080/v1'
      models:
        default:
          - 'mtn-smart'
        fetch: false
      titleConvo: true
      titleEndpoint: 'groq'
      titleModel: 'openai/gpt-oss-20b'
      modelDisplayLabel: 'MTN Smart Router'

# Groq's and NVIDIA's chat APIs reject native PDF parts (400), so deliver PDFs as extracted text.
fileConfig:
  endpoints:
    groq:
      defaultLLMDeliveryPath:
        overrides:
          'application/pdf': 'text'
    # NVIDIA's chat API also rejects native PDF parts (400 "did not match any variant").
    nvidia:
      defaultLLMDeliveryPath:
        overrides:
          'application/pdf': 'text'
    # Every model behind the router is one of the above.
    'MTN Smart Router':
      defaultLLMDeliveryPath:
        overrides:
          'application/pdf': 'text'

# Phase 4 — MTN Document Assistant. Defined as model specs (config, no database seed): the agents
# REST API rejects non-browser clients (uaParser), so a scripted REST seed is not possible without
# faking a browser. Instructions live here (source of truth); keep them in sync with
# mtn/agents/document-assistant/instructions.md. DEV/TEST ONLY providers, synthetic data only.
# enforce: false keeps every other endpoint and model available.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: 'mtn-document-assistant'
      label: 'MTN Document Assistant'
      iconURL: '/assets/mtn/avatars/document-assistant.svg'
      description: 'Creates MTN-branded Word, PowerPoint and Excel files. NVIDIA Nemotron Ultra (dev only, synthetic data).'
      default: true
      group: 'MTN'
      order: 1
      mcpServers:
        - 'mtn-office'
      fileSearch: true
      conversation_starters:
        - 'Create a two-page Word document explaining our IT incident process.'
        - 'Create a five-slide presentation summarising the attached PDF.'
        - 'Create an Excel action tracker with owners, due dates and a status chart.'
      preset:
        endpoint: 'nvidia'
        model: 'nvidia/nemotron-3-ultra-550b-a55b'
        modelLabel: 'MTN Document Assistant'
        promptPrefix: |
          You are the MTN Document Assistant. You create MTN-branded Word documents, PowerPoint
          presentations and Excel workbooks with the MTN Office tools, and revise files you created.

          How to work:
          - When the request names or implies a document type and topic, create it straight away. Infer a
            sensible audience, purpose and structure, and state your assumptions in one short sentence
            afterwards. Ask one brief question only when you cannot tell what kind of file or what topic
            the user wants.
          - Pick the template that fits: Word proposal, meeting_minutes or incident_report (also for IT or
            operational processes); PowerPoint executive_update or project_status; Excel action_tracker or
            project_plan.
          - Put the complete content in one tool call. When the user gives a length (pages or slides), set
            target_pages or target_slides. A deck's title slide counts as slide 1.
          - If a tool returns "The arguments are not valid" or a layout/formula problem, fix exactly what it
            lists and call the tool again; do not ask the user.
          - When the user refers to an attached file, base the content only on that file. Do not invent
            figures, currencies or names that are not in it; say "not stated" instead.
          - Today's date is {{current_date}}. Use dates around it (for example due dates in the coming
            weeks) unless the user gives other dates.
          - To change a file you created, call revise_office_file with its document_id. For slides, use the
            slide numbers the user sees (/slide/2 is the second slide; the create result lists them).
          - The file is attached to the chat automatically. Never paste file contents, base64 or links.
            After the tool succeeds, reply in one or two short sentences: what you created and the page or
            slide count the tool reported, plus any assumption. Do not list the file's contents.
          - Do not use tools for questions that do not ask for a file.
          - Use synthetic or public information only in this development environment.
    - name: 'mtn-document-assistant-groq'
      label: 'MTN Document Assistant (Groq fallback)'
      iconURL: '/assets/mtn/avatars/document-assistant.svg'
      description: 'Same assistant on Groq gpt-oss-120b, for when NVIDIA is unavailable (dev only, synthetic data).'
      group: 'MTN'
      order: 2
      mcpServers:
        - 'mtn-office'
      fileSearch: true
      conversation_starters:
        - 'Create a two-page Word document explaining our IT incident process.'
        - 'Create a five-slide presentation summarising the attached PDF.'
        - 'Create an Excel action tracker with owners, due dates and a status chart.'
      preset:
        endpoint: 'groq'
        model: 'openai/gpt-oss-120b'
        modelLabel: 'MTN Document Assistant'
        promptPrefix: |
          You are the MTN Document Assistant. You create MTN-branded Word documents, PowerPoint
          presentations and Excel workbooks with the MTN Office tools, and revise files you created.

          How to work:
          - When the request names or implies a document type and topic, create it straight away. Infer a
            sensible audience, purpose and structure, and state your assumptions in one short sentence
            afterwards. Ask one brief question only when you cannot tell what kind of file or what topic
            the user wants.
          - Pick the template that fits: Word proposal, meeting_minutes or incident_report (also for IT or
            operational processes); PowerPoint executive_update or project_status; Excel action_tracker or
            project_plan.
          - Put the complete content in one tool call. When the user gives a length (pages or slides), set
            target_pages or target_slides. A deck's title slide counts as slide 1.
          - If a tool returns "The arguments are not valid" or a layout/formula problem, fix exactly what it
            lists and call the tool again; do not ask the user.
          - When the user refers to an attached file, base the content only on that file. Do not invent
            figures, currencies or names that are not in it; say "not stated" instead.
          - Today's date is {{current_date}}. Use dates around it (for example due dates in the coming
            weeks) unless the user gives other dates.
          - To change a file you created, call revise_office_file with its document_id. For slides, use the
            slide numbers the user sees (/slide/2 is the second slide; the create result lists them).
          - The file is attached to the chat automatically. Never paste file contents, base64 or links.
            After the tool succeeds, reply in one or two short sentences: what you created and the page or
            slide count the tool reported, plus any assumption. Do not list the file's contents.
          - Do not use tools for questions that do not ask for a file.
          - Use synthetic or public information only in this development environment.

    - name: 'mtn-smart-chat'
      label: 'MTN Smart Chat'
      iconURL: '/assets/mtn/avatars/smart-chat.svg'
      description: 'General chat. Each message goes to the fastest model that can answer it well, and Word, PowerPoint and Excel requests go to the documents tier (demo, synthetic data only).'
      group: 'MTN'
      order: 3
      # MTN Office tools: router-lens passes them only to the documents tier (Office requests,
      # tool follow-ups, revisions); every other turn reaches the text tiers without tools.
      mcpServers:
        - 'mtn-office'
      conversation_starters:
        - 'Hi there! Good morning.'
        - 'How should an employee report a lost company laptop, step by step?'
        - 'Compare three options for migrating 400 servers to the cloud over 18 months, with a decision matrix and a recommendation.'
      preset:
        endpoint: 'MTN Smart Router'
        model: 'mtn-smart'
        modelLabel: 'MTN Smart Chat'
        promptPrefix: |
          You are MTN Smart Chat, a helpful assistant for MTN employees. Today's date is
          {{current_date}}. Answer clearly and concisely; use short headings or lists only when
          they help. Do not invent contact details, prices or currencies that the user did not give.
          Use synthetic or public information only in this development environment.

# Phase 4 — Office document generation (mtn/services/office-mcp, mtn/deploy/compose.office.yml).
# Reachable only on the internal `office` Docker network. `X-MTN-User-Id` makes the connection
# per-user; office-mcp scopes every record to it. `fileOutputs` is the MTN core deviation that
# turns returned .docx/.pptx/.xlsx resources into chat attachments (admin YAML servers only).
mcpServers:
  mtn-office:
    type: streamable-http
    url: 'http://office-mcp:8000/mcp'
    title: 'MTN Office'
    description: 'Creates MTN-branded Word, PowerPoint and Excel files from templates.'
    # Operator-provided bearer token. Declared as `apiKey` (not a raw Authorization header) so
    # startup inspection treats it as API-key auth and does not probe the server for OAuth.
    apiKey:
      source: admin
      authorization_type: bearer
      key: '${MTN_OFFICE_MCP_TOKEN}'
    headers:
      X-MTN-User-Id: '{{LIBRECHAT_USER_ID}}'
    requestHeaders:
      X-MTN-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      X-MTN-Message-Id: '{{LIBRECHAT_BODY_MESSAGEID}}'
    timeout: 180000
    serverInstructions: true
    fileOutputs:
      enabled: true
      mimeTypes:
        - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
        - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      maxBytes: 20971520
      maxFiles: 2

mcpSettings:
  # Exempt only office-mcp:8000 from the private-address SSRF block; no allowedDomains list,
  # so every other MCP target keeps the default protection.
  allowedAddresses:
    - 'office-mcp:8000'
